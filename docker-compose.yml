name: talentflow

# Local development infrastructure for TalentFlow.
#
# Host ports are offset from the defaults so this stack can coexist with other
# local stacks. Override any of them from the shell or a root .env file.
#
#   postgres  5433  (container 5432)
#   redis     6380  (container 6379)
#   minio     9020  (container 9000)  console 9021
#   mailpit   1035  (container 1025)  ui      8035
#
# All credentials below are throwaway local values and are intentionally public.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow
      POSTGRES_DB: talentflow
      # Deterministic collation for reproducible index ordering.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on a fresh volume: creates `talentflow_test` and the
      # NOBYPASSRLS `talentflow_app_test` role the RLS suite connects as.
      # Existing volumes are handled by `pnpm db:test:setup`.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talentflow -d talentflow']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: talentflow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # `minio/minio` is no longer published on Docker Hub; the Bitnami legacy
    # build is a drop-in S3-compatible server for local development.
    image: bitnamilegacy/minio:latest
    container_name: talentflow-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: talentflow
      MINIO_ROOT_PASSWORD: talentflow123
      # Created on first boot with private (default) access policy.
      MINIO_DEFAULT_BUCKETS: talentflow-files
    ports:
      - '${MINIO_PORT:-9020}:9000'
      - '${MINIO_CONSOLE_PORT:-9021}:9001'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # NOTE: the private bucket is created by the API at boot
  # (StorageService.ensureBucket), which removes the need for an `mc` sidecar.

  mailpit:
    image: axllent/mailpit:latest
    container_name: talentflow-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1035}:1025'
      - '${MAILPIT_UI_PORT:-8035}:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:
  minio-data:
